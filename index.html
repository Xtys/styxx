        .titleText {

        .mod-button {
            position: relative;
            padding: 2px 4px;
            background-color: #aea1b2;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            color: #625467; /*  text color */
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center; /* Ensure text is centered */
            width: 120px; /* Set a fixed width to prevent button from resizing */
          }
          
          /* On hover, change background color and scale the button */
          .mod-button:hover {
            background-color: #777790;
            transform: scale(1.05);
          }
          
   
          /* Change text on hover using CSS */
          .mod-button:hover::after {
            content: attr(data-hover); /* Use the data-hover attribute for hover text */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            color: #625467;
            font-size: 16px;
            display: inline-block;
          }
      </style>
